<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earthquake Monitor Tests</title>
  <style>
    body { max-width: 800px; margin: 2rem auto; padding: 0 1rem; font-family: "Segoe UI", sans-serif; color: #0f172a; }
    li { margin: 0.5rem 0; }
    .pass { color: #166534; }

  </style>
</head>
<body>
